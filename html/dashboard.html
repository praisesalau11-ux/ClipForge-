<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | ClipForge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/index.css">
<link rel="stylesheet" href="../css/dashboard.css"></head>
<body>
<header><div class="wrap"><nav>
  <a class="logo" href="dashboard.html">Clip<b>Forge</b></a>
  <div class="user"><span id="name"></span><button class="btn alt sm" id="logout">Log out</button></div>
</nav></div></header>

<main class="wrap dash">
  <h1 id="hello">Loading...</h1>
  <p class="lead">Describe what you want to promote and choose what to create.</p>

  <form id="f" class="panel">
    <label for="prompt">Your idea</label>
    <textarea id="prompt" rows="4" maxlength="500" required placeholder="Example: Weekend sale, 20% off all coffee beans"></textarea>
    <div class="two">
      <div><label for="type">Create</label>
        <select id="type"><option>Images and caption</option><option>Voiceover</option><option>Short video</option><option>Full post pack</option></select></div>
      <div><label for="platform">Platform</label>
        <select id="platform"><option>Instagram</option><option>TikTok</option><option>YouTube Shorts</option><option>Facebook</option><option>LinkedIn</option><option>X</option></select></div>
    </div>
    <button class="btn" type="submit">Generate</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <h2>Your campaigns</h2>
  <div class="list" id="list"><p class="sub">No campaigns yet. Your first one will appear here.</p></div>
</main>
<script type="module" src="../js/dashboard.js"></script>
</body></html>
