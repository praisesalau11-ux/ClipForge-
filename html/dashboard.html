<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | ClipForge</title>
  <script src="../js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/index.css">
<link rel="stylesheet" href="../css/dashboard.css"></head>
<body>
<header><div class="wrap"><nav>
  <a class="logo" href="dashboard.html">Clip<b>Forge</b></a>
  <div class="user">
    <span class="pill" id="credits"></span>
    <a class="navlink" href="profile.html">Profile</a>
    <a class="navlink" href="settings.html">Settings</a>
    <button class="btn alt sm" id="logout">Log out</button>
  </div>
</nav></div></header>

<main class="wrap dash">
  <h1 id="hello">Loading...</h1>
  <p class="lead">Describe your offer and get a ready-to-post ad.</p>
  <div class="banner" id="banner" hidden>Add your business details so ads match your brand. <a href="profile.html">Complete profile</a></div>

  <div class="layout">
    <form id="f" class="panel">
      <h2>Create an ad</h2>
      <label for="prompt">What are you promoting?</label>
      <textarea id="prompt" rows="4" maxlength="500" required placeholder="Example: Weekend sale, 20% off all coffee beans"></textarea>
      <label for="goal">Goal</label>
      <select id="goal"><option>Sales</option><option>Awareness</option><option>Bookings</option><option>Followers</option></select>
      <label for="type">Create</label>
      <select id="type">
        <option value="Images and caption">Images and caption · 1 credit</option>
        <option value="Voiceover">Voiceover · 1 credit</option>
        <option value="Full post pack">Full post pack · 2 credits</option>
        <option value="Short video">Short video · 10 credits</option>
      </select>
      <label for="platform">Platform</label>
      <select id="platform"><option>Instagram</option><option>TikTok</option><option>YouTube Shorts</option><option>Facebook</option><option>LinkedIn</option><option>X</option></select>
      <button class="btn" type="submit">Generate ad</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>

    <section>
      <h2>Your ads</h2>
      <div class="list" id="list"><p class="empty">Loading...</p></div>
    </section>
  </div>
</main>
<script type="module" src="../js/dashboard.js"></script>
</body></html>
