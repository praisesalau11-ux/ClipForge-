<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | ClipForge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/index.css"></head>
  <script src="../js/theme.js"></script>
<body><div class="auth"><div class="box">
<a class="back" href="html/screen.html">Back</a>
<h1>Log in</h1>
<p class="sub">Welcome back. Enter your details to continue.</p>
<button class="btn alt" id="google" type="button">Log in with Google</button>
<p class="sub" style="text-align:center;margin:16px 0 0">or use your email</p>
<form id="f">
<label for="email">Email</label><input id="email" type="email" required autocomplete="email">
<label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
<button class="btn" type="submit">Log in</button>
</form>
<p class="msg" id="msg" role="alert"></p>
</div></div>
<script type="module" src="../js/login.js"></script></body></html>
